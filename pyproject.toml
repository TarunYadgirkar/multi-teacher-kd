[project]
name = "mtkd"
version = "0.2.0"
description = "Multi-teacher on-policy distillation: which teacher should teach a small LLM, per task category?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "datasets>=3.0",
    "rouge-score>=0.1.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
mtkd = "mtkd.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtkd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
