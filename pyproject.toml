[project]
name = "mtkd"
version = "0.1.0"
description = "Multi-teacher on-policy distillation: which teacher should teach, per task category?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=1.0.0",
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "rouge-score>=0.1.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtkd"]
