# End-to-end check with tiny models in a few minutes:
#   uv run mtkd reproduce --config configs/smoke.yaml
student: HuggingFaceTB/SmolLM2-135M-Instruct
teachers:
  big: HuggingFaceTB/SmolLM2-360M-Instruct
  small: HuggingFaceTB/SmolLM2-135M-Instruct
default_teacher: big
revisions:
  HuggingFaceTB/SmolLM2-135M-Instruct: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  HuggingFaceTB/SmolLM2-360M-Instruct: a10cc1512eabd3dde888204e902eca88bddb4951
mps_memory_fraction: 0.3
paths: {results: results/smoke, outputs: outputs/smoke, figures: results/smoke/figures}
report_path: results/smoke/REPORT.md

data:
  train: {math: 4, code: 4, qa: 4, summ: 4}
  probe: {math: 3, code: 3, qa: 3, summ: 3}
  eval: {math: 3, code: 3, qa: 3, summ: 3}

generation:
  batch_size: 4
  first_pass: 16
  max_new_tokens: {math: 32, code: 32, qa: 8, summ: 24}
  code_workers: 2

train:
  seeds: [0]
  epochs: 1
  batch_size: 2
  learning_rate: 1.0e-4
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  lmbda: 1.0
  beta: 0.5
  temperature: 1.0
  max_new_tokens: {math: 16, code: 16, qa: 4, summ: 16}
  loss_chunk_tokens: 64
  teacher_cache: 1
  lora: {r: 8, alpha: 16, dropout: 0.0}

conditions:
  sft: {kind: sft}
  fixed: {policy: fixed, teacher: big}
  task: {policy: map, map: {math: big, code: big, qa: small, summ: small}}
  learned: {policy: learned}
  ensemble: {policy: ensemble}
